spring.application.name=SpringBootSecqurityEx

# Load optional, ignored local development settings from the project-root .env file.
spring.config.import=optional:file:.env[.properties]


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjdXJlSldUVFNjcmV0S2V5Rm9yU3ByaW5nQm9vdDIwMjY=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origin-patterns=http://localhost:4200/



# =========================================================
# BOOTSTRAP USERS ? FACTORY MANAGEMENT SYSTEM
# =========================================================

app.bootstrap.enabled=true

# ==============================
# SUPER ADMIN
# ==============================
app.bootstrap-super-admin.username=superadmin
app.bootstrap-super-admin.email=superadmin@gmail.com
app.bootstrap-super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:11111111}

# ==============================
# FACTORY ADMIN
# ==============================
app.bootstrap-factory-admin.username=factoryadmin
app.bootstrap-factory-admin.email=factoryadmin@gmail.com
app.bootstrap-factory-admin.password=${BOOTSTRAP_FACTORY_ADMIN_PASSWORD:22222222}

# ==============================
# MANAGER
# ==============================
app.bootstrap-manager.username=manager
app.bootstrap-manager.email=manager@gmail.com
app.bootstrap-manager.password=${BOOTSTRAP_MANAGER_PASSWORD:33333333}

# ==============================
# SUPERVISOR
# ==============================
app.bootstrap-supervisor.username=supervisor
app.bootstrap-supervisor.email=supervisor@gmail.com
app.bootstrap-supervisor.password=${BOOTSTRAP_SUPERVISOR_PASSWORD:44444444}

# ==============================
# OPERATOR
# ==============================
app.bootstrap-operator.username=operator
app.bootstrap-operator.email=operator@gmail.com
app.bootstrap-operator.password=${BOOTSTRAP_OPERATOR_PASSWORD:55555555}

# ==============================
# QUALITY INSPECTOR
# ==============================
app.bootstrap-quality-inspector.username=qualityinspector
app.bootstrap-quality-inspector.email=qualityinspector@gmail.com
app.bootstrap-quality-inspector.password=${BOOTSTRAP_QUALITY_INSPECTOR_PASSWORD:66666666}

# ==============================
# VIEWER
# ==============================
app.bootstrap-viewer.username=viewer
app.bootstrap-viewer.email=viewer@gmail.com
app.bootstrap-viewer.password=${BOOTSTRAP_VIEWER_PASSWORD:77777777}

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/car}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# SERVER
# =========================================================
server.port=8080